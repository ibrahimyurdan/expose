[package]
name = "expose"
version = "0.2.0"
description = "League of Legends lobby companion that surfaces champ-select teammates, auto-accepts queue pops, and dodges in one click"
authors = ["moge"]
edition = "2021"
repository = "https://github.com/ibrahimyurdan/expose"

[[bin]]
name = "expose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
directories = "6.0.0"
futures-util = "0.3.32"
log = "0.4"
notify = "8.2.0"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "gzip"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2.4.3"
tauri-plugin-window-state = "2"
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = "0.29.0"

[target.'cfg(target_os = "macos")'.dependencies]
# hides the traffic lights, which tauri has no setting for.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
# the os build number tells windows 11 (its own window frame) from windows 10.
windows-version = "0.1"
# square corners and a dark border for the frameless window on windows 11.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# the webview's memory target, low while the window hides in the tray. the
# version tauri's webview uses, so the types match.
webview2-com = "0.38"

# small and fast release builds: one codegen unit with full lto, tuned for
# size, without symbols. a panic aborts after the panic hook has logged it
# (see log_panics in main.rs).
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
