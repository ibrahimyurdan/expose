[package]
name = "expose"
version = "0.1.0"
description = "League of Legends lobby companion that surfaces champ-select teammates, auto-accepts queue pops, and dodges in one click"
authors = ["moge"]
edition = "2021"
repository = "https://github.com/ibrahimyurdan/expose"

[[bin]]
name = "expose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
directories = "6.0.0"
futures-util = "0.3.32"
notify = "8.2.0"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls = "0.23.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-store = "2.4.3"
thiserror = "2.0.18"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = "0.29.0"
window-vibrancy = "0.7.1"
