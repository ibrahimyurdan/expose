<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- expose's app icon: a flat yellow eye on a navy tile, in the spirit of
       league's vision ping. the lids run out to sharp points, the iris is a
       ring hanging from the top lid, and a diamond pupil sits in its open
       middle. the tile is on the macos icon grid (824 px inside the 1024
       canvas). expose's own drawing: its 1024 px render is source.png
       (rsvg-convert -w 1024 -h 1024 source.svg), and
       `npm run tauri icon src-tauri/icons/source.png` makes the app icons
       from that. the tray eye (tray.svg) and the in-app mark
       (src/components/art/Mark.tsx) draw the same eye. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132131"/>
      <stop offset="1" stop-color="#040a11"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="300" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdd73"/>
      <stop offset=".55" stop-color="#f6c14b"/>
      <stop offset="1" stop-color="#e9a02c"/>
    </linearGradient>
    <!-- the iris's open middle, cut through the top lid as well -->
    <mask id="open" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="432" r="58" fill="#000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <!-- the eye on its own 1024 grid, shrunk onto the tile -->
  <g transform="translate(512 512) scale(.84) translate(-512 -512)" fill="url(#yellow)">
    <g mask="url(#open)">
      <!-- the lids: the band between two sharp almonds -->
      <path fill-rule="evenodd" d="M156 512C334 421.3 369.6 316 512 316C654.4 316 690 421.3 868 512C690 602.7 654.4 708 512 708C369.6 708 334 602.7 156 512ZM242 512C377 430.88 404 384 512 384C620 384 647 430.88 782 512C647 593.12 620 640 512 640C404 640 377 593.12 242 512Z"/>
      <!-- the iris, its top on the top of the lids -->
      <circle cx="512" cy="432" r="116"/>
    </g>
    <!-- the diamond pupil -->
    <path d="M512 398 532 432 512 466 492 432Z"/>
  </g>
</svg>
