<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- expose's app icon: the molded eye on a navy tile, on the macos icon
       grid (the tile is 824 px inside the 1024 canvas). expose's own
       drawing; `npm run tauri icon src-tauri/icons/source.png` makes the
       app icons from its render. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#132f43"/>
      <stop offset=".55" stop-color="#071a28"/>
      <stop offset="1" stop-color="#020b13"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a32"/>
      <stop offset="1" stop-color="#2a1e0c"/>
    </linearGradient>
    <radialGradient id="socket" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#0c2836"/>
      <stop offset="1" stop-color="#010a13"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#eafffd"/>
      <stop offset=".35" stop-color="#4fe3d4"/>
      <stop offset=".8" stop-color="#0a8f9a"/>
      <stop offset="1" stop-color="#05505a"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <ellipse cx="512" cy="196" rx="300" ry="64" fill="#fff" opacity=".035"/>

  <g filter="url(#lift)" stroke="#241a0a" stroke-width="4" stroke-linejoin="miter">
    <!-- the eye's four faces, lit from the top left -->
    <path d="M196 512 360 382 512 382 512 438 400 438 284 512Z" fill="#f4e2b8"/>
    <path d="M828 512 664 382 512 382 512 438 624 438 740 512Z" fill="#dcbf80"/>
    <path d="M196 512 360 642 512 642 512 586 400 586 284 512Z" fill="#9a7230"/>
    <path d="M828 512 664 642 512 642 512 586 624 586 740 512Z" fill="#6e4f1e"/>
    <path d="M284 512 400 438 624 438 740 512 624 586 400 586Z" fill="url(#socket)"/>
    <!-- the eight-sided iris, its four quarters shaded the same way -->
    <path d="M512 410 440 440 410 512 512 512Z" fill="#f0d79c"/>
    <path d="M512 410 584 440 614 512 512 512Z" fill="#dcbf80"/>
    <path d="M410 512 440 584 512 614 512 512Z" fill="#a37b36"/>
    <path d="M614 512 584 584 512 614 512 512Z" fill="#7a5a22"/>
    <path d="M512 452 554 470 572 512 554 554 512 572 470 554 452 512 470 470Z" fill="url(#iris)"/>
    <path d="M512 488 536 512 512 536 488 512Z" fill="#041b22" stroke="none"/>
    <path d="M488 474 500 466 506 478 494 486Z" fill="#ffffff" stroke="none" opacity=".85"/>
    <!-- the brow and the chin -->
    <path d="M512 300 600 340 512 326 424 340Z" fill="#e8cf94"/>
    <path d="M512 724 600 684 512 698 424 684Z" fill="#8a6528"/>
  </g>
</svg>
