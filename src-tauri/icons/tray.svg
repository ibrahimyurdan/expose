<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="182 182 660 660">
  <!-- the windows tray icon: the molded eye alone on a clear background,
       filling the square so it reads at 16 px. its 32 px render is
       tray.png (rsvg-convert -w 32 -h 32 tray.svg), which tray.rs builds
       into the app. -->
