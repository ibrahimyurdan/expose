<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- the windows tray icon: the app icon's eye (source.svg) alone on a clear
       background, filling the square so it reads at 16 px, with a dark edge
       so it holds on a light taskbar as well as a dark one. at tray size the
       diamond pupil would blur, so the iris's middle is solid dark instead,
       the way it looks on the icon's tile. its 32 px render is tray.png
       (rsvg-convert -w 32 -h 32 tray.svg), which tray.rs builds into the
       app. -->
  <defs>
    <linearGradient id="yellow" x1="0" y1="300" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffdd73"/>
      <stop offset=".55" stop-color="#f6c14b"/>
      <stop offset="1" stop-color="#e9a02c"/>
    </linearGradient>
    <path id="lids" fill-rule="evenodd" d="M156 512C334 421.3 369.6 316 512 316C654.4 316 690 421.3 868 512C690 602.7 654.4 708 512 708C369.6 708 334 602.7 156 512ZM242 512C377 430.88 404 384 512 384C620 384 647 430.88 782 512C647 593.12 620 640 512 640C404 640 377 593.12 242 512Z"/>
    <!-- the iris's open middle, cut through the top lid as well -->
    <mask id="open" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="432" r="58" fill="#000"/>
    </mask>
  </defs>

  <g transform="translate(512 512) scale(1.22) translate(-512 -512)">
    <!-- the dark edge: the same eye, 18 wider all round, the iris's middle
         filled -->
    <g fill="#140c02" stroke="#140c02" stroke-width="36" stroke-linejoin="miter" stroke-miterlimit="3">
      <use href="#lids"/>
      <circle cx="512" cy="432" r="116"/>
    </g>
    <g fill="url(#yellow)" mask="url(#open)">
      <use href="#lids"/>
      <circle cx="512" cy="432" r="116"/>
    </g>
  </g>
</svg>
